<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body class="auth">
<div class="card">
    <h1>Criar conta</h1>

    <div th:if="${erro}" class="alert error" th:text="${erro}"></div>

    <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>Nome completo</label>
        <input type="text" name="nomeCompletoUsuario" required />
        <label>E-mail</label>
        <input type="email" name="emailUsuario" required />
        <label>Telefone (opcional)</label>
        <input type="text" name="telefoneUsuario" />
        <label>Senha</label>
        <input type="password" name="senhaUsuario" minlength="6" required />
        <button type="submit">Cadastrar</button>
    </form>

    <p class="hint">
        Já tem conta? <a th:href="@{/login}">Entrar</a>
    </p>
</div>
</body>
</html>
